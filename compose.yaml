services:
  tide:
    build: .
    ports:
      - "127.0.0.1:${TIDE_PORT:-4318}:4318"
    environment:
      HOST: 0.0.0.0
      PORT: 4318
      DATA_DIR: /app/.data
    volumes:
      - tide-data:/app/.data
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  tide-data:
